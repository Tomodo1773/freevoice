name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: '11.15.1'

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install frontend deps
        shell: pwsh
        run: sfw pnpm.cmd install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch Rust dependencies
        shell: bash
        env:
          # Socket Firewall's proxy CA has no reachable revocation status on Windows.
          # Other TLS certificate checks remain enabled.
          CARGO_HTTP_CHECK_REVOKE: 'false'
        run: sfw cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Cargo check
        run: cargo check --frozen --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Cargo build
        run: cargo build --frozen --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Cargo test
        run: cargo test --frozen --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
